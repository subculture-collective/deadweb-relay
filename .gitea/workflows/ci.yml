name: CI
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull request verification runs on the GitHub mirror (.github/workflows/mirror-ci.yml)
  # and GitHub Actions deploys main (.github/workflows/deploy.yml); this workflow
  # only verifies main.
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - name: Verify modules and vet
      shell: bash
      run: |-
        go mod verify
        go vet ./...
    - name: Test
      shell: bash
      run: go test -count=1 ./...
    - name: Build
      shell: bash
      run: go build ./...
    - name: Check backup archive acceptance
      run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
