name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    branches-ignore:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.27.3
        cache: true
        cache-dependency-path: go.mod
    - name: Verify modules and vet
      shell: bash
      run: |-
        go mod verify
        go vet ./...
    - name: Test
      shell: bash
      run: go test -count=1 ./...
    - name: Build
      shell: bash
      run: go build ./...
    - name: Check backup archive acceptance
      run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
    if: github.repository == 'subculture-collective/deadweb-relay'
  image:
    name: Build relay image and smoke-test it
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Build the relay image from the verified revision
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
        image="fleet-deploy/deadweb-relay/relay:$DEPLOY_REVISION"
        docker build --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
          --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/deadweb-relay" -t "$image" .
        bash scripts/check-image.sh "$image"
    if: github.repository == 'subculture-collective/deadweb-relay'
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/deadweb-relay'
    needs:
    - verify
    - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'verify', 'image'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
